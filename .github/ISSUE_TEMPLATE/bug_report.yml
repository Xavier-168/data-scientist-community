name: Bug 报告
description: 使用合成或脱敏数据报告可复现问题
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: "不要上传 Cookie、Token、许可证、真实 Excel、客户信息、浏览器 Profile 或未脱敏截图。安全漏洞请使用 Private Vulnerability Reporting。"
  - type: input
    id: version
    attributes:
      label: 版本/提交
      placeholder: v0.1.0 或 commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      placeholder: macOS、芯片、Python、Node、Rust 版本
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 涉及平台
      options: [不涉及平台, 抖音, 小红书, B站, 快手, 飞书, Tauri/桌面壳]
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 最小复现步骤
      description: 使用合成数据并说明是否需要人工扫码。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与脱敏证据
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: 安全确认
      options:
        - label: 我已删除密钥、Cookie、个人和客户信息。
          required: true
        - label: 我只测试自己有权访问的账号和数据。
          required: true
