[package]
name = "data-scientist"
version = "1.1.0"
description = "数据科学家桌面控制台"
edition = "2021"

[lib]
name = "data_scientist_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
test-harness = []
# 生产模式必需：tauri build / 正式分发通过该 feature 切换到内嵌资源协议，
# 缺失时 tauri::is_dev() 恒为 true，主窗口会去连 devUrl(127.0.0.1:1420)。
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["pem", "pkcs8"] }
fs2 = "0.4"
hex = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.33"
tauri = { version = "2", features = [] }
tar = "0.4"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
zstd = "0.13"
tauri-plugin-single-instance = "2"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["process", "signal"] }
object = { version = "0.39", default-features = false, features = ["read_core", "macho", "std"] }
rustix = { version = "1.1.4", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
object = { version = "0.39", default-features = false, features = ["read_core", "pe", "std"] }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
