[package]
name = "data-scientist"
version = "1.1.0"
description = "数据科学家桌面控制台"
edition = "2021"

[lib]
name = "data_scientist_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
test-harness = []

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["pem", "pkcs8"] }
fs2 = "0.4"
hex = "0.4"
nix = { version = "0.29", features = ["process", "signal"] }
object = { version = "0.39", default-features = false, features = ["read_core", "macho", "std"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustix = { version = "1.1.4", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.33"
tauri = { version = "2", features = [] }
tar = "0.4"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
zstd = "0.13"
