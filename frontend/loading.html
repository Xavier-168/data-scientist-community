<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>启动中 — 数据科学家 Community</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    background: #fafafa;
    color: #111;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .container {
    text-align: center;
    max-width: 420px;
    padding: 0 24px;
  }

  /* ── Lottie 容器 ── */
  .lottie-wrap {
    width: 180px;
    height: 180px;
    margin: 0 auto 32px;
    position: relative;
  }

  /* CSS fallback spinner（Lottie 加载前/失败时显示） */
  .css-spinner {
    width: 180px;
    height: 180px;
    position: absolute;
    top: 0;
    left: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .css-spinner .ring {
    width: 80px;
    height: 80px;
    border: 3px solid #e6e6e6;
    border-top-color: #111;
    border-radius: 50%;
    animation: spin 0.9s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Lottie 加载成功后隐藏 CSS spinner */
  .lottie-loaded .css-spinner { display: none; }

  dotlottie-player {
    width: 180px;
    height: 180px;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .lottie-loaded dotlottie-player { opacity: 1; }

  /* ── 文字 ── */
  h1 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.3px;
    margin-bottom: 8px;
  }

  .subtitle {
    font-size: 14px;
    color: #666;
    margin-bottom: 36px;
  }

  /* ── 状态区 ── */
  .status-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .status-text {
    font-size: 13px;
    color: #999;
    transition: color 0.3s;
    min-height: 20px;
  }
  .status-text.active { color: #666; }
  .status-text.success { color: #10B981; }
  .status-text.error { color: #EF4444; }

  /* ── 进度条 ── */
  .progress-track {
    width: 240px;
    height: 6px;
    background: #e6e6e6;
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: #111;
    border-radius: 999px;
    width: 0%;
    transition: width 0.4s ease;
  }

  .progress-meta {
    width: 240px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: #8b8b8b;
  }

  .hint-text {
    font-size: 12px;
    color: #8b8b8b;
    line-height: 1.6;
    max-width: 320px;
  }

  .timeout-actions {
    display: none;
    gap: 10px;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 4px;
  }

  .timeout-actions.visible {
    display: flex;
  }

  .action-btn {
    appearance: none;
    border: 1px solid #d8d8d8;
    background: #fff;
    color: #222;
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 12px;
    text-decoration: none;
    cursor: pointer;
    transition: border-color 0.2s ease, background 0.2s ease;
  }

  .action-btn:hover {
    border-color: #111;
    background: #f6f6f6;
  }

  /* ── 步骤列表 ── */
  .steps {
    margin-top: 40px;
    display: flex;
    gap: 32px;
    justify-content: center;
  }
  .step {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    opacity: 0.3;
    transition: opacity 0.4s;
  }
  .step.active { opacity: 1; }
  .step.done { opacity: 0.6; }

  .step-icon {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #f0f0f0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    transition: background 0.3s, color 0.3s;
  }
  .step.active .step-icon { background: #111; color: #fff; }
  .step.done .step-icon { background: #10B981; color: #fff; }

  .step-label {
    font-size: 11px;
    color: #999;
    white-space: nowrap;
  }
  .step.active .step-label { color: #111; font-weight: 500; }
  .step.done .step-label { color: #10B981; }

  /* ── 底部 ── */
  .footer {
    position: fixed;
    bottom: 24px;
    font-size: 11px;
    color: #ccc;
  }

  /* ── 成功跳转动画 ── */
  .fade-out {
    animation: fadeOut 0.5s ease forwards;
  }
  @keyframes fadeOut {
    to { opacity: 0; transform: translateY(-10px); }
  }
</style>
</head>
<body>

<div class="container" id="main">
  <div class="lottie-wrap" id="lottieWrap">
    <div class="css-spinner"><div class="ring"></div></div>
  </div>

  <h1>数据科学家 Community</h1>
  <p class="subtitle">正在启动本地服务，请稍候...</p>

  <div class="status-area">
    <div class="progress-track">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="progress-meta">
      <span id="progressPct">10%</span>
      <span id="elapsedText">已等待 0 秒</span>
    </div>
    <div class="status-text active" id="statusText">检测运行环境...</div>
    <div class="hint-text" id="hintText">首次启动会额外准备运行环境，通常需要 10 到 30 秒。</div>
    <div class="timeout-actions" id="timeoutActions">
      <a class="action-btn" id="logLink" href="#" target="_blank" rel="noreferrer">打开启动日志</a>
      <button class="action-btn" id="retryBtn" type="button">重新打开工作台</button>
    </div>
  </div>

  <div class="steps">
    <div class="step active" id="step-env">
      <div class="step-icon">1</div>
      <div class="step-label">环境检测</div>
    </div>
    <div class="step" id="step-server">
      <div class="step-icon">2</div>
      <div class="step-label">启动服务</div>
    </div>
    <div class="step" id="step-ready">
      <div class="step-icon">3</div>
      <div class="step-label">准备就绪</div>
    </div>
  </div>
</div>

<div class="footer">v1.0 · 本地运行 · 数据不上传</div>

<script>
(function() {
  const params = new URLSearchParams(window.location.search);
  const PORT = params.get('port') || 8811;
  const BASE = `http://127.0.0.1:${PORT}`;
  const SESSION = new URLSearchParams(window.location.hash.replace(/^#/, '')).get('session') || '';
  const LAUNCHER_LOG = params.get('launcher_log') || '';
  const RUNNER_LOG = params.get('runner_log') || '';
  const POLL_INTERVAL = 800;
  const MAX_WAIT = 120000; // 2 分钟超时

  const bar = document.getElementById('progressBar');
  const pctEl = document.getElementById('progressPct');
  const elapsedEl = document.getElementById('elapsedText');
  const statusEl = document.getElementById('statusText');
  const hintEl = document.getElementById('hintText');
  const timeoutActionsEl = document.getElementById('timeoutActions');
  const logLinkEl = document.getElementById('logLink');
  const retryBtnEl = document.getElementById('retryBtn');

  // ── 步骤切换 ─────────────────────────────────────────────────
  function setStep(stepId, state) {
    const el = document.getElementById(stepId);
    if (!el) return;
    el.className = 'step ' + state;
    if (state === 'done') {
      el.querySelector('.step-icon').textContent = '\u2713';
    }
  }

  function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = 'status-text ' + (cls || 'active');
  }

  function setProgress(pct) {
    bar.style.width = pct + '%';
    pctEl.textContent = `${Math.max(0, Math.min(100, Math.round(pct)))}%`;
  }

  function setHint(text) {
    hintEl.textContent = text;
  }

  function monitorUrl() {
    return SESSION ? `${BASE}/monitor#session=${encodeURIComponent(SESSION)}` : `${BASE}/monitor`;
  }

  function updateElapsed(elapsedMs) {
    elapsedEl.textContent = `已等待 ${Math.max(0, Math.round(elapsedMs / 1000))} 秒`;
  }

  function showTimeoutActions() {
    timeoutActionsEl.classList.add('visible');
  }

  function toFileUrl(rawPath) {
    if (!rawPath) return '';
    return `file://${encodeURI(rawPath)}`;
  }

  const logTarget = toFileUrl(LAUNCHER_LOG || RUNNER_LOG);
  if (logTarget) {
    logLinkEl.href = logTarget;
  } else {
    logLinkEl.style.display = 'none';
  }

  retryBtnEl.addEventListener('click', () => {
    window.location.href = monitorUrl();
  });

  // ── 阶段 1: 环境检测（模拟 1 秒） ─────────────────────────
  setProgress(10);
  setTimeout(() => {
    setStep('step-env', 'done');
    setStep('step-server', 'active');
    setStatus('正在启动 HTTP 服务...');
    setProgress(30);
    startPolling();
  }, 1000);

  // ── 阶段 2: 轮询服务器 ─────────────────────────────────────
  let startTime = Date.now();
  let pollCount = 0;

  function startPolling() {
    const timer = setInterval(async () => {
      pollCount++;
      const elapsed = Date.now() - startTime;
      updateElapsed(elapsed);

      // 进度条模拟（30% → 85% 渐进）
      const fakePct = Math.min(85, 30 + (elapsed / MAX_WAIT) * 55);
      setProgress(fakePct);

      // 更新状态文字
      if (elapsed > 30000) {
        setStatus('启动偏慢，正在继续重试...', 'active');
        setHint('你可以先查看启动日志；如果服务已经起来，也可以直接重新打开工作台。');
        showTimeoutActions();
      } else if (elapsed > 15000) {
        setStatus('服务正在初始化，首次启动可能较慢...');
        setHint('首次启动会额外准备运行环境，请保持此页面打开。');
      } else if (elapsed > 5000) {
        setStatus('正在加载依赖...');
        setHint('正在检查本地运行环境与浏览器组件。');
      }

      // 超时
      if (elapsed > MAX_WAIT) {
        clearInterval(timer);
        setStatus('启动超时，请检查终端窗口的错误信息', 'error');
        setHint('如果日志中没有异常，可以点击“重新打开工作台”再次探测服务状态。');
        showTimeoutActions();
        return;
      }

      // 探测服务
      try {
        const resp = await fetch(`${BASE}/progress`, {
          signal: AbortSignal.timeout(2000)
        });
        if (resp.ok) {
          clearInterval(timer);
          onServerReady();
        }
      } catch(e) { /* 还没起来，继续等 */ }
    }, POLL_INTERVAL);
  }

  // ── 阶段 3: 服务就绪，跳转 ─────────────────────────────────
  function onServerReady() {
    setStep('step-server', 'done');
    setStep('step-ready', 'active');
    setProgress(100);
    setStatus('服务已就绪，正在跳转...', 'success');
    setHint('本地服务已启动完成，即将进入数据工作台。');

    setTimeout(() => {
      setStep('step-ready', 'done');
      document.getElementById('main').classList.add('fade-out');

      setTimeout(() => {
        window.location.href = monitorUrl();
      }, 500);
    }, 600);
  }

})();
</script>
</body>
</html>
